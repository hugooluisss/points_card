<main class="mx-auto max-w-5xl px-4 py-8 sm:px-8">
  <p class="text-sm font-medium text-slate-500">Comercio</p>
  <h1 class="mt-1 text-3xl font-semibold tracking-tight">Configuración</h1>
  <p class="mt-2 text-slate-600">Administra las preferencias de tu negocio.</p>

  <section class="mt-7 grid gap-4 sm:grid-cols-2">
    @if (canManageRegistration) {
      <a
        routerLink="/configuracion/registro"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:border-teal-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
      >
        <h2 class="text-lg font-semibold">Registro de clientes</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600">
          Configura los datos, la marca y el aviso que verán tus clientes.
        </p>
      </a>
    }
    @if (canManageBilling) {
      <a
        routerLink="/configuracion/facturacion"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:border-teal-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
      >
        <h2 class="text-lg font-semibold">Plan y facturación</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600">
          Consulta tu plan y administra la suscripción del negocio.
        </p>
      </a>
    }
  </section>
</main>
